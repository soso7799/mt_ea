# 每 10 天（每月 1、11、21 日）下載/更新 FTMO 商品歷史資料
#  - 資料檔：Releases → market-data（每個週期一個 zip）
#  - 總表：data_tools/DATA_SUMMARY.md、data_tools/inventory.csv（提交回 repo）
# 第一次需要補很多歷史資料，一次跑不完會自動在下次接著補；也可以到 Actions 手動按 Run workflow 加速。
name: Update market data

on:
  schedule:
    - cron: "17 3 1,11,21 * *"
  workflow_dispatch:
    inputs:
      only:
        description: "只更新這些商品（逗號分隔，空白 = 全部）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: market-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: data_tools
        run: npm install --no-audit --no-fund

      - name: Download previous data
        id: dl
        run: |
          set -e
          mkdir -p zips market_data
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" -D zips --clobber
            for z in zips/*.zip; do [ -f "$z" ] && unzip -q -o "$z" -d market_data; done
            [ -f zips/state.json ] && cp zips/state.json market_data/state.json
          fi
          rm -rf zips
          du -sh market_data || true

      - name: Update
        working-directory: data_tools
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then node update.mjs --data ../market_data --budget 300 --only "$ONLY"
          else node update.mjs --data ../market_data --budget 300; fi

      - name: Upload data to release
        # 下載舊資料失敗時不上傳，避免空資料覆蓋
        if: ${{ !cancelled() && steps.dl.outcome == 'success' }}
        run: |
          [ -f market_data/state.json ] || exit 0
          mkdir -p out
          cp market_data/state.json out/state.json
          cd market_data
          for d in */; do d="${d%/}"; zip -q -r "../out/${d}.zip" "$d"; rm -rf "$d"; done
          cd ..
          ls -lh out
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Market data" \
            --notes "FTMO 商品歷史資料（Dukascopy BID，FTMO 伺服器時間）。每個週期一個 zip，內含各商品 CSV。總表見 data_tools/DATA_SUMMARY.md。"
          gh release upload "$TAG" out/* --clobber

      - name: Commit summary
        if: ${{ !cancelled() && steps.dl.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_tools/DATA_SUMMARY.md data_tools/inventory.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update market data summary"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
